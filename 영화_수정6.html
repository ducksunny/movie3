<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>영화 티어리스트 🎬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Jua', sans-serif;
    background: linear-gradient(135deg, #2d5016 0%, #4a7c2e 100%);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
  }
  h1 {
    font-family: 'Do Hyeon', sans-serif;
    color: white;
    text-align: center;
    font-size: 42px;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
    margin-bottom: 15px;
  }
  .guide {
    text-align: center;
    color: #fff;
    background: rgba(0,0,0,0.3);
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 15px;
  }
  .tier-row {
    display: flex;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    min-height: 110px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  .tier-label {
    width: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Do Hyeon', sans-serif;
    font-size: 42px;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tier-label:hover {
    filter: brightness(1.15);
    transform: scale(1.05);
  }
  body.has-selection .tier-label {
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.4); }
  }
  .tier-S { background: linear-gradient(135deg, #FFD700, #FFA500); color: #333; }
  .tier-A { background: linear-gradient(135deg, #FF8C42, #FF6B1A); }
  .tier-B { background: linear-gradient(135deg, #87CEEB, #5DADE2); color: #333; }
  .tier-C { background: linear-gradient(135deg, #aaa, #777); }
  .tier-content {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    padding: 12px;
    gap: 12px;
  }
  .pool-label {
    color: white;
    margin-top: 25px;
    margin-bottom: 12px;
    font-size: 22px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .back-to-pool {
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    padding: 8px 16px;
    border: none;
    border-radius: 20px;
    background: #FFD700;
    color: #2d5016;
    cursor: pointer;
  }
  .back-to-pool:hover { background: #FFA500; }
  .pool {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    min-height: 110px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 12px 8px;
    width: 85px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    transition: all 0.2s;
    user-select: none;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
  }
  .card.selected {
    outline: 4px solid #FFD700;
    outline-offset: 2px;
    transform: translateY(-8px) scale(1.08);
    box-shadow: 0 8px 20px rgba(255,215,0,0.6);
  }
  .card .emoji {
    font-size: 42px;
    line-height: 1.2;
  }
  .card .title {
    font-size: 14px;
    margin-top: 6px;
    color: #2d5016;
  }
  .buttons {
    text-align: center;
    margin-top: 25px;
  }
  .main-btn {
    font-family: 'Jua', sans-serif;
    padding: 12px 24px;
    margin: 0 6px;
    border: none;
    border-radius: 25px;
    background: white;
    cursor: pointer;
    font-size: 16px;
    color: #2d5016;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }
  .main-btn:hover {
    background: #FFD700;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <h1>🎬 내 영화 티어리스트 🎬</h1>
  <div class="guide">
    👆 영화 카드를 <b>클릭</b>해서 선택 → 원하는 <b>티어(S/A/B/C)</b>를 <b>클릭</b>! (드래그도 OK)
  </div>

  <div class="tier-row">
    <div class="tier-label tier-S" onclick="moveToTier('S')">S</div>
    <div class="tier-content" data-tier="S" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
  </div>
  <div class="tier-row">
    <div class="tier-label tier-A" onclick="moveToTier('A')">A</div>
    <div class="tier-content" data-tier="A" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
  </div>
  <div class="tier-row">
    <div class="tier-label tier-B" onclick="moveToTier('B')">B</div>
    <div class="tier-content" data-tier="B" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
  </div>
  <div class="tier-row">
    <div class="tier-label tier-C" onclick="moveToTier('C')">C</div>
    <div class="tier-content" data-tier="C" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
  </div>

  <div class="pool-label">
    <span>📦 후보 영화</span>
    <button class="back-to-pool" onclick="moveToTier('pool')">📦 후보로 되돌리기</button>
  </div>
  <div class="pool" data-tier="pool" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

  <div class="buttons">
    <button class="main-btn" onclick="save()">💾 저장</button>
    <button class="main-btn" onclick="reset()">🔄 초기화</button>
  </div>

<script>
  const movies = [
    { id: 1,  title: "어바웃타임",   emoji: "⏰" },
    { id: 2,  title: "인터스텔라",   emoji: "🚀" },
    { id: 3,  title: "라라랜드",     emoji: "🎹" },
    { id: 4,  title: "기생충",       emoji: "🏠" },
    { id: 5,  title: "코코",         emoji: "💀" },
    { id: 6,  title: "노트북",       emoji: "📓" },
    { id: 7,  title: "해리포터",     emoji: "⚡" },
    { id: 8,  title: "타이타닉",     emoji: "🚢" },
    { id: 9,  title: "조커",         emoji: "🃏" },
    { id: 10, title: "토이스토리",   emoji: "🤠" }
  ];

  let selectedCard = null;

  function createCard(movie) {
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.id = 'movie-' + movie.id;
    card.innerHTML = '<div class="emoji">' + movie.emoji + '</div><div class="title">' + movie.title + '</div>';
    card.ondragstart = (e) => e.dataTransfer.setData('text', card.id);
    card.onclick = (e) => {
      e.stopPropagation();
      selectCard(card);
    };
    return card;
  }

  function selectCard(card) {
    if (selectedCard === card) {
      card.classList.remove('selected');
      selectedCard = null;
      document.body.classList.remove('has-selection');
      return;
    }
    if (selectedCard) selectedCard.classList.remove('selected');
    selectedCard = card;
    card.classList.add('selected');
    document.body.classList.add('has-selection');
  }

  function moveToTier(tier) {
    if (!selectedCard) {
      alert('먼저 영화 카드를 클릭해서 선택해주세요! 🎬');
      return;
    }
    const target = document.querySelector('[data-tier="' + tier + '"]');
    target.appendChild(selectedCard);
    selectedCard.classList.remove('selected');
    selectedCard = null;
    document.body.classList.remove('has-selection');
  }

  function allowDrop(e) { e.preventDefault(); }

  function drop(e) {
    e.preventDefault();
    const id = e.dataTransfer.getData('text');
    const card = document.getElementById(id);
    if (card) e.currentTarget.appendChild(card);
  }

  function save() {
    const data = {};
    document.querySelectorAll('[data-tier]').forEach(el => {
      data[el.dataset.tier] = [...el.children].map(c => c.id);
    });
    localStorage.setItem('tierlist', JSON.stringify(data));
    alert('저장 완료! 💾');
  }

  function reset() {
    if (!confirm('정말 초기화할까요? 🔄')) return;
    localStorage.removeItem('tierlist');
    document.querySelectorAll('[data-tier]').forEach(el => el.innerHTML = '');
    const pool = document.querySelector('[data-tier="pool"]');
    movies.forEach(m => pool.appendChild(createCard(m)));
  }

  function load() {
    const pool = document.querySelector('[data-tier="pool"]');
    const saved = localStorage.getItem('tierlist');
    if (!saved) {
      movies.forEach(m => pool.appendChild(createCard(m)));
      return;
    }
    const data = JSON.parse(saved);
    movies.forEach(m => {
      const card = createCard(m);
      let placed = false;
      for (const tier in data) {
        if (data[tier].includes('movie-' + m.id)) {
          document.querySelector('[data-tier="' + tier + '"]').appendChild(card);
          placed = true;
          break;
        }
      }
      if (!placed) pool.appendChild(card);
    });
  }

  load();
</script>
</body>
</html>
