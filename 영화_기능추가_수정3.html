<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영화 티어리스트</title>
  <style>
    :root { --paper:#faf8f3; --ink:#242922; --muted:#5f685d; --line:#d9dad1; --green:#276453; --sage:#e3eee7; --peach:#f2e6dc; --red:#c0392b; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:system-ui,-apple-system,sans-serif; line-height:1.6;  }
    main { width:min(100% - 32px,860px); margin:32px auto 48px; }
    header { margin-bottom: 24px; }
    h1 { margin:0; font-size:clamp(26px,5vw,34px); letter-spacing:-.03em; }
    .sub { margin:8px 0 0; color:var(--muted); }
    
    /* 입력창 정리 */
    .tools { display:flex; gap:8px; width:100%; margin-top:20px; }
    .tools input { flex:1; border:1.5px solid var(--line); border-radius:12px; padding:12px; font:inherit; }
    .tools button { padding:0 20px; border:1px solid var(--green); border-radius:12px; font-weight:700; background:var(--green); color:#fff; cursor:pointer; }
    .tools .reset { color:var(--green); background:#fff; }
    
    #message { min-height:26px; margin:14px 0; font-size:14px; color:var(--muted); }
    .tiers { display:grid; gap:12px; }
    .row { display:flex; min-height:140px; background:#fff; border:1.5px solid var(--line); border-radius:16px; overflow:hidden; }
    .row.over { outline:3px solid var(--green); outline-offset:1px; }
    
    .label { width:80px; flex-shrink:0; border:0; color:white; font-weight:800; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; }
    .label span { font-size:28px; }
    .label small { font-size:12px; opacity:0.9; }
    .S .label { background:#a55239; } .A .label { background:#b4763e; } .B .label { background:#276453; } .C .label { background:#67725d; }
    
    .drop { flex:1; display:flex; flex-wrap:wrap; align-content:flex-start; gap:12px; padding:12px; min-height:138px; }
    .pool { margin-top:24px; }
    .pool-head { margin:0 0 10px; border:0; background:transparent; color:var(--muted); font-size:18px; font-weight:700; cursor:pointer; }
    #pool { border:1.5px dashed var(--line); border-radius:16px; background:#fff; }
    
    /* 영화 카드 및 제목 가독성 개선 */
    .card { 
      position:relative; width:100px; height:145px; border-radius:10px; 
      cursor:grab; overflow:hidden; border:1px solid rgba(0,0,0,0.1);
      background-size: cover; background-position: center;
      display: flex; align-items: flex-end; padding: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card[aria-pressed="true"] { outline:4px solid var(--green); outline-offset:2px; }
    
    .card-title {
      width: 100%; padding: 8px 4px;
      background: rgba(0, 0, 0, 0.7); /* 제목 배경을 더 어둡게 */
      color: #ffffff; /* 글자색은 완전한 흰색 */
      font-size: 12px; font-weight: 800; text-align: center;
      text-shadow: 1px 1px 3px #000; /* 글자 그림자 강화 */
      line-height: 1.2; word-break: keep-all;
    }

    .del-btn { 
      position:absolute; top:5px; right:5px; width:22px; height:22px; 
      border-radius:50%; border:none; background:rgba(255,255,255,0.8); 
      color:var(--red); font-size:16px; font-weight:bold; display:flex; 
      align-items:center; justify-content:center; cursor:pointer; z-index: 10;
    }
    .del-btn:hover { background:var(--red); color:white; }

    @media(max-width:420px) { .label { width:65px; } .card { width:85px; height:125px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>내 영화 티어리스트</h1><p class="sub">영화를 드래그하거나 클릭해서 등급을 매겨보세요.</p></header>
    
    <form class="tools" id="add-form">
      <input id="title" placeholder="추가할 영화 제목을 입력하세요" maxlength="50">
      <button type="submit">추가</button>
      <button type="button" class="reset" id="reset">초기화</button>
    </form>

    <p id="message" role="status">영화를 선택해 등급을 나누어 보세요.</p>
    
    <section class="tiers" id="tiers"></section>
    
    <section class="pool">
      <button class="pool-head" id="pool-label" type="button">아직 안 정한 영화 (0)</button>
      <div class="drop" id="pool" data-tier="pool"></div>
    </section>
  </main>

  <script>
    const KEY = "movie-tier-final-v4";
    const LEVELS = ['S', 'A', 'B', 'C', 'pool'];
    
    // 실제 작동하는 포스터 이미지 주소들
    const initialData = [
      { id: 'm1', title: '기생충', tier: 'pool', img: 'https://m.media-amazon.com/images/M/MV/MV5BYWZjMjk3ZTItODQ2ZC00NTY5LWE0ZDYtZTI3MjcwN2Q5NTVkXkEyXkFqcGdeQXVyODk4OTc3MTY@._V1_UX182_CR0,0,182,268_AL_.jpg' },
      { id: 'm2', title: '인터스텔라', tier: 'pool', img: 'https://m.media-amazon.com/images/M/MV/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_UX182_CR0,0,182,268_AL_.jpg' },
      { id: 'm3', title: '라라랜드', tier: 'pool', img: 'https://m.media-amazon.com/images/M/MV/MV5BMzUzNDM2NzM2MV5BMl5BanBnXkFtZTgwNTM3NTg4OTE@._V1_UX182_CR0,0,182,268_AL_.jpg' },
      { id: 'm4', title: '센과 치히로', tier: 'pool', img: 'https://m.media-amazon.com/images/M/MV/MV5BMjlmZmI5MDctZTExOC00NWUyLTg5MTktOTYzN2Q5YXZzYzhjXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_UX182_CR0,0,182,268_AL_.jpg' },
      { id: 'm5', title: '엔드게임', tier: 'pool', img: 'https://m.media-amazon.com/images/M/MV/MV5BMTc5MDE2ODcwNV5BMl5BanBnXkFtZTgwMzI2NzQ2NzM@._V1_UX182_CR0,0,182,268_AL_.jpg' },
      { id: 'm6', title: '범죄도시', tier: 'pool', img: 'https://m.media-amazon.com/images/M/MV/MV5BMmI2YmE3ZGYtYmQxYy00YmZmLWExN2MtYmE0YmI1ZGRiYmE1XkEyXkFqcGdeQXVyMzE4MDkyNTA@._V1_UX182_CR0,0,182,268_AL_.jpg' },
      { id: 'm7', title: '타이타닉', tier: 'pool', img: 'https://m.media-amazon.com/images/M/MV/MV5BMDdmZGU3NDQtY2E5My00ZTliLWIzOTUtMTY4ZGI1YjdiNjk3XkEyXkFqcGdeQXVyNTA4NzY1MzY@._V1_UX182_CR0,0,182,268_AL_.jpg' },
      { id: 'm8', title: '토이 스토리', tier: 'pool', img: 'https://m.media-amazon.com/images/M/MV/MV5BMDU2ZWJlMjktNjMyMi00YzhmLTgwOTUtMzU2YWVlMGVlNDU0XkEyXkFqcGdeQXVyNjU0OTQ0OTY@._V1_UX182_CR0,0,182,268_AL_.jpg' }
    ];

    let state = { nextId: 9, items: initialData };
    let selected = null;

    // 저장된 데이터 불러오기
    try {
      const stored = JSON.parse(localStorage.getItem(KEY));
      if (stored && stored.items.length > 0) state = stored;
    } catch {}

    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function showMessage(msg) { document.querySelector('#message').textContent = msg; }

    function move(id, tier) {
      const item = state.items.find(i => i.id === id);
      if (item) { item.tier = tier; selected = null; save(); render(); }
    }

    function remove(id) {
      state.items = state.items.filter(i => i.id !== id);
      selected = null; save(); render();
      showMessage('영화를 삭제했습니다.');
    }

    function card(item) {
      const el = document.createElement('div');
      el.className = 'card'; el.draggable = true;
      el.style.backgroundImage = `url('${item.img}')`;
      el.style.backgroundColor = '#ddd'; // 이미지 로딩 전 배경색
      el.setAttribute('aria-pressed', String(selected === item.id));
      
      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = item.title;
      
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn'; delBtn.innerHTML = '&times;';
      delBtn.onclick = (e) => { e.stopPropagation(); remove(item.id); };
      
      el.append(delBtn, title);
      el.onclick = () => { selected = selected === item.id ? null : item.id; render(); };
      el.ondragstart = (e) => e.dataTransfer.setData('text/plain', item.id);
      return el;
    }

    function render() {
      const tiersContainer = document.querySelector('#tiers');
      tiersContainer.innerHTML = '';
      
      LEVELS.filter(l => l !== 'pool').forEach(tier => {
        const row = document.createElement('div'); row.className = 'row ' + tier;
        const tierItems = state.items.filter(i => i.tier === tier);
        
        const label = document.createElement('button');
        label.className = 'label';
        label.innerHTML = `<span>${tier}</span><small>${tierItems.length}개</small>`;
        label.onclick = () => { if (selected) move(selected, tier); };
        
        const drop = document.createElement('div'); drop.className = 'drop';
        tierItems.forEach(item => drop.append(card(item)));
        
        // 드롭 이벤트
        drop.ondragover = (e) => { e.preventDefault(); row.classList.add('over'); };
        drop.ondragleave = () => row.classList.remove('over');
        drop.ondrop = (e) => { e.preventDefault(); move(e.dataTransfer.getData('text/plain'), tier); };
        drop.onclick = () => { if (selected) move(selected, tier); };
        
        row.append(label, drop); tiersContainer.append(row);
      });

      const pool = document.querySelector('#pool');
      const poolItems = state.items.filter(i => i.tier === 'pool');
      pool.innerHTML = '';
      poolItems.forEach(item => pool.append(card(item)));
      document.querySelector('#pool-label').textContent = `아직 안 정한 영화 (${poolItems.length})`;
      
      pool.ondragover = (e) => e.preventDefault();
      pool.ondrop = (e) => { e.preventDefault(); move(e.dataTransfer.getData('text/plain'), 'pool'); };
      pool.onclick = () => { if (selected) move(selected, 'pool'); };
    }

    document.querySelector('#add-form').onsubmit = (e) => {
      e.preventDefault();
      const input = document.querySelector('#title');
      const title = input.value.trim();
      if (!title) return;
      
      // 새 영화 추가 (이미지는 기본 아이콘 주소로 대체)
      state.items.push({ 
        id: 'm' + state.nextId++, 
        title, 
        tier: 'pool', 
        img: 'https://via.placeholder.com/100x145/276453/ffffff?text=MOVIE' 
      });
      input.value = ''; save(); render();
    };

    document.querySelector('#reset').onclick = () => {
      if (confirm('모든 데이터를 초기화할까요?')) {
        state = { nextId: 9, items: [...initialData] };
        save(); render();
      }
    };

    render();
  </script>
</body>
</html>
